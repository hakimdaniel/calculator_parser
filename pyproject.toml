[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-parser"
version = "0.1.0"
description = "A simple arithmetic expression parser and calculator"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
